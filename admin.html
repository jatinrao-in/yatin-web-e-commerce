<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Form Submissions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f4fbf6', 100: '#e3f5e9', 500: '#2e7d32', 600: '#276a2a', 900: '#123314',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; color: #334155; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        .card-header { background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; font-weight: 600; color: #0f172a; }
        .card-body { padding: 1.5rem; }
        .data-row { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #f1f5f9; }
        .data-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .data-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; font-weight: 600; }
        .data-value { font-size: 1.05rem; color: #1e293b; font-weight: 500; white-space: pre-wrap; }
        .badge { background: #e3f5e9; color: #166534; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; }
        
        .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: #2e7d32; color: white; }
        .btn-primary:hover { background: #1e5321; }
        .btn-outline { border: 1px solid #cbd5e1; background: white; color: #475569; }
        .btn-outline:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .btn-danger:hover { background: #fecaca; }
    </style>
</head>
<body class="antialiased min-h-screen">
    
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-brand-100 rounded-full flex items-center justify-center text-brand-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900">Admin Dashboard</h1>
                    <p class="text-xs text-gray-500">Form Submissions Viewer</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="index.html" class="btn btn-outline text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Form
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div id="noDataState" class="hidden text-center py-20">
            <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <h2 class="text-2xl font-semibold text-gray-800 mb-2">No Submissions Found</h2>
            <p class="text-gray-500 mb-6">There is currently no data in localStorage.</p>
            <a href="index.html" class="btn btn-primary">Go to Form</a>
        </div>

        <div id="dataContainer" class="hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                <div>
                    <h2 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
                        Latest Submission
                        <span id="timestampBadge" class="badge bg-blue-100 text-blue-700 font-normal text-xs"></span>
                    </h2>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button id="copyBtn" class="btn btn-outline text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy All
                    </button>
                    <button id="downloadBtn" class="btn btn-primary text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Download JSON
                    </button>
                    <button id="clearBtn" class="btn btn-danger text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Clear Data
                    </button>
                </div>
            </div>

            <!-- Sections grid -->
            <div id="sectionsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Cards will be injected here dynamically -->
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2">
        <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMessage">Action successful</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const noDataState = document.getElementById('noDataState');
            const dataContainer = document.getElementById('dataContainer');
            const sectionsGrid = document.getElementById('sectionsGrid');
            const timestampBadge = document.getElementById('timestampBadge');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            // Map internal keys to readable labels (Fallback if needed, though we can just use keys if they're readable)
            const keyLabels = {
                companyName: "Company / Brand Name", tagline: "Tagline", domain: "Domain Name",
                address: "Business Address", phone: "Contact Phone", whatsapp: "WhatsApp Number",
                email: "Email Address", gst: "GST Number", brandStory: "Founded Year / Brand Story",
                logoStatus: "Logo Status", brandColors: "Brand Colors Preference", existingWebsite: "Existing Website",
                totalProducts: "Total Products", imagesReady: "Images Ready?", categories: "Categories",
                bestsellers: "Best-Selling Products", priceRange: "Price Range", comboPricing: "Combo/Bulk Pricing",
                upcomingProducts: "Upcoming Products", notifyFeature: "Notify Me Feature",
                payments: "Payment Methods", shipping: "Shipping Areas", coupons: "Coupon System",
                login: "Customer Login", tracking: "Order Tracking", certs: "Certifications",
                otherCerts: "Other Certifications", reviews: "Customer Reviews", endorsement: "Doctor Endorsement",
                policy: "Return & Refund Policy", socialInsta: "Instagram", socialFb: "Facebook", socialYt: "YouTube",
                competitorUrl: "Competitor Website", homepageRequests: "Homepage Requests", launchDate: "Launch Date"
            };

            function getLabel(key) {
                return keyLabels[key] || key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
            }

            function showToast(message) {
                toastMessage.textContent = message;
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 3000);
            }

            function loadData() {
                const rawData = localStorage.getItem('ayurvedicClientData');
                if (!rawData) {
                    noDataState.classList.remove('hidden');
                    dataContainer.classList.add('hidden');
                    return null;
                }

                try {
                    const parsed = JSON.parse(rawData);
                    
                    // Format Date
                    const date = new Date(parsed.timestamp);
                    timestampBadge.textContent = date.toLocaleString('en-US', { 
                        month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });

                    // Render Sections
                    sectionsGrid.innerHTML = '';
                    const data = parsed.data;
                    
                    for (const [sectionName, sectionData] of Object.entries(data)) {
                        let rowsHtml = '';
                        for (const [key, value] of Object.entries(sectionData)) {
                            let displayValue = value;
                            if (Array.isArray(value)) {
                                displayValue = value.length > 0 ? value.map(v => `<span class="badge inline-block mr-1 mb-1">${v}</span>`).join('') : '<span class="text-gray-400 italic">None selected</span>';
                            } else if (!value) {
                                displayValue = '<span class="text-gray-400 italic">Not provided</span>';
                            }
                            
                            rowsHtml += `
                                <div class="data-row">
                                    <span class="data-label">${getLabel(key)}</span>
                                    <div class="data-value mt-1">${displayValue}</div>
                                </div>
                            `;
                        }

                        const cardHtml = `
                            <div class="card">
                                <div class="card-header">${sectionName}</div>
                                <div class="card-body">
                                    ${rowsHtml}
                                </div>
                            </div>
                        `;
                        sectionsGrid.innerHTML += cardHtml;
                    }

                    noDataState.classList.add('hidden');
                    dataContainer.classList.remove('hidden');
                    return parsed;
                } catch (e) {
                    console.error("Error parsing localstorage data", e);
                    noDataState.classList.remove('hidden');
                    dataContainer.classList.add('hidden');
                    return null;
                }
            }

            const currentData = loadData();

            // Actions
            document.getElementById('clearBtn').addEventListener('click', () => {
                if(confirm("Are you sure you want to clear the submission data? This cannot be undone.")) {
                    localStorage.removeItem('ayurvedicClientData');
                    loadData();
                    showToast("Data cleared successfully");
                }
            });

            document.getElementById('downloadBtn').addEventListener('click', () => {
                if(!currentData) return;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData.data, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "ayurvedic_requirements_" + Date.now() + ".json");
                document.body.appendChild(downloadAnchorNode); // required for firefox
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                showToast("JSON Downloaded");
            });

            document.getElementById('copyBtn').addEventListener('click', () => {
                if(!currentData) return;
                let text = "Ayurvedic Website Requirements\n===============================\n\n";
                for (const [sectionName, sectionData] of Object.entries(currentData.data)) {
                    text += `--- ${sectionName} ---\n`;
                    for (const [key, value] of Object.entries(sectionData)) {
                        let valStr = value;
                        if(Array.isArray(value)) valStr = value.join(', ');
                        text += `${getLabel(key)}: ${valStr || 'N/A'}\n`;
                    }
                    text += '\n';
                }

                navigator.clipboard.writeText(text).then(() => {
                    showToast("Copied to clipboard!");
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                    alert("Failed to copy. See console for details.");
                });
            });
        });
    </script>
</body>
</html>
